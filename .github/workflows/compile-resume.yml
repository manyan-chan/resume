
name: Compile All LaTeX Documents

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '.github/workflows/compile-resume.yml'

  pull_request:
    branches: [main]
    paths:
      - '**.tex'
      - '.github/workflows/compile-resume.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile All PDFs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            lmodern

      - name: Compile all TEX files
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "Compiling: $file"

            latexmk -pdf \
              -interaction=nonstopmode \
              -halt-on-error \
              -file-line-error \
              "$file"

            count=$((count + 1))
          done < <(find . -type f -name '*.tex' \
            -not -path './.git/*' -print0)

          if [ "$count" -eq 0 ]; then
            echo "No .tex files found."
            exit 1
          fi

          echo "Successfully compiled $count LaTeX document(s)."

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v7
        with:
          name: compiled-pdfs
          path: '**/*.pdf'
          if-no-files-found: error
          retention-days: 30
